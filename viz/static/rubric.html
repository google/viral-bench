<html lang="en">
<head>
<meta charset="utf-8">
<title>Rubric grade viewer · ViralBench</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="app">

<div class="topbar">
  <div class="brand">Viral<span>Bench</span></div>
  <nav class="navlinks">
    <a href="/">Home</a>
    <a href="/founder">Founder</a>
    <a href="/crowd">Crowd</a>
    <a href="/rubric" class="active">Rubric</a>
  </nav>
  <div class="picker">
    <input id="gradeInput" placeholder="paste a grade id, or a build id to list its grades…" spellcheck="false">
    <button id="loadBtn" class="primary">Load</button>
    <button id="browseBtn">Browse all grades…</button>
  </div>
  <div class="spacer"></div>
  <button id="founderBtn" title="Open the founder build this grade scored" disabled>Founder build</button>
  <button id="crowdBtn" title="Open the crowd runs for this build" disabled>Crowd runs</button>
  <button id="dlJson" disabled>JSON ↓</button>
  <button id="dlZip" disabled>Zip ↓</button>
</div>

<div id="head" class="section"></div>

<!-- No #transport. A founder build is a time series and a crowd run is a
     simulation, so both get a scrubber. A rubric grade is a verdict document:
     it has no clock, and giving it one would be copying the convention rather
     than following it. The only temporal thing here is the grader's own
     trajectory, which lives in the Transcript tab where it belongs. -->

<div class="main">
  <div class="col pane" id="itemPane" style="flex:0 0 44%">
    <div class="section" style="border-bottom:1px solid var(--line)">
      <h2>Items <span class="count" id="itemCount"></span></h2>
      <div class="chips" id="itemFilters"></div>
    </div>
    <div class="scroll" id="items"><div class="empty">Load a rubric grade to begin.</div></div>
  </div>

  <div class="col" id="sidePane" style="flex:1 1 56%">
    <div class="tabs" id="tabs"></div>
    <div class="scroll" id="tabBody"></div>
  </div>
</div>

<div class="overlay" id="browser" hidden>
  <div class="modal">
    <div class="modal-head">
      <input id="searchInput" placeholder="filter by grade id, build id, idea, model…" spellcheck="false">
      <label class="hint"><input type="checkbox" id="divergedOnly" style="min-width:auto"> disagrees with ViralScore</label>
      <label class="hint"><input type="checkbox" id="gatedOnly" style="min-width:auto"> gate failures only</label>
      <button id="closeBrowse">Close</button>
    </div>
    <div class="modal-body scroll" id="browseBody"></div>
  </div>
</div>

<script type="module" src="/static/js/rubric.js"></script>
</body>
</html>
