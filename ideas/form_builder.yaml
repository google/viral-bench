# Idea Bench spec. See ideas/README.md for the field reference.
# Reference app (ground truth): Formbricks — https://github.com/formbricks/formbricks
# Verified 12,732 GitHub stars on 2026-08-06.
# Show HN reached 155 points: https://news.ycombinator.com/item?id=32303986

idea_id: form_builder
title: "FormForge"
pitch: "Build a survey in a couple of minutes, share a link, and watch the answers arrive."
problem: "Hosted form tools cap responses on the free tier and keep your respondents' answers on their servers, which is a poor fit for anything sensitive or high volume."
target_user: "Small teams and researchers who need to collect structured responses and own the resulting data."
core_features:
  - "Build a form by adding questions of several types (short text, long text, multiple choice, rating)"
  - "Reorder, edit, and delete questions, then publish the form to a shareable URL"
  - "Anyone with the link can fill in and submit the form without an account"
  - "A results view lists every submission and shows a per-question summary (counts for choices, averages for ratings)"
  - "Accounts so a creator sees only their own forms, while published forms stay publicly answerable"
success_criteria: "A signed-in creator builds a form with a multiple-choice and a rating question and publishes it; a second, separate visitor opens the public URL and submits answers; the creator's results view then shows that submission and a summary reflecting exactly one response."
allowed_scope: full-stack-app
difficulty: medium

ground_truth:
  source: "Hacker News"
  metric: github_stars
  value: 12732
