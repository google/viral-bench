# Idea Bench spec. See ideas/README.md for the field reference.
# Reference app (ground truth): Stirling-PDF — https://github.com/Stirling-Tools/Stirling-PDF
# Verified 89,006 GitHub stars on 2026-08-06.

idea_id: local_pdf_toolkit
title: "PDF Workshop"
pitch: "A private, all-in-one toolkit for everyday PDF tasks that runs in your browser."
problem: "Common PDF tasks (merge, split, compress, convert) usually mean uploading sensitive files to ad-filled websites that keep your documents on their servers."
target_user: "Anyone who regularly manipulates PDFs and doesn't want to upload private documents to third-party sites."
core_features:
  - "Merge multiple PDFs and split or extract specific pages"
  - "Reorder, rotate, and delete pages in a visual page view"
  - "Convert images to PDF and export PDF pages back to images"
  - "Compress a PDF to reduce its file size"
  - "All processing happens client-side; files never leave the browser"
success_criteria: "A user can combine several PDFs, reorder and rotate pages, and export the result entirely in the browser with no uploads."
allowed_scope: client-app
difficulty: medium

ground_truth:
  source: "Reddit / Hacker News"
  metric: github_stars
  value: 89006
