# Idea Bench spec. See ideas/README.md for the field reference.
# Reference app (ground truth): it-tools — https://github.com/CorentinTh/it-tools
# Verified 40,106 GitHub stars on 2026-08-06.

idea_id: it_tools_dev_toolbox
title: "DevToolbox"
pitch: "One fast, ad-free page with all the little converters and generators developers reach for daily."
problem: "Developers constantly need small utilities (JSON formatting, base64, JWT decode, UUIDs) and end up on slow, ad-cluttered sites that may ship pasted data to a server."
target_user: "Developers and technical users who want quick, private, client-side dev utilities."
core_features:
  - "Searchable catalog of small tools grouped by category"
  - "Core converters: JSON formatter/validator, base64 encode/decode, URL encode/decode"
  - "Generators: UUID/ULID, random password/token, hashes (MD5/SHA-256)"
  - "JWT decoder that shows header, payload, and claims"
  - "Everything runs fully client-side; no input leaves the browser"
success_criteria: "A user can search for a tool, run it entirely in the browser, and get correct output with no network calls."
allowed_scope: client-app
difficulty: easy

ground_truth:
  source: "Hacker News / Reddit"
  metric: github_stars
  value: 40106
