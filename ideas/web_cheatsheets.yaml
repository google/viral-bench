# Idea Bench spec. See ideas/README.md for the field reference.
# Reference app (ground truth): reference (quick reference cheat sheets)
#   — https://github.com/jaywcjlove/reference
# Verified 15,172 GitHub stars on 2026-08-06.

idea_id: web_cheatsheets
title: "Cheatdeck"
pitch: "Example-first cheat sheets for the tools you use, one keystroke away."
problem: "Official docs are exhaustive and slow to search when all you need is the one invocation you always forget, and the sites that fix this are buried in ads."
target_user: "Developers who want a fast, copy-pasteable reminder rather than a full manual page."
core_features:
  - "A browsable index of cheat sheets grouped by topic (shell, git, regex, CSS, SQL)"
  - "Each sheet is a set of short entries: a snippet plus a one-line description"
  - "Instant fuzzy search across every sheet, filtering as you type"
  - "Copy any snippet to the clipboard with one click"
  - "Ships with its content bundled so it works fully offline, with no network calls"
success_criteria: "Searching for a command name filters to the matching entries across sheets and shows correct, copy-pasteable examples with descriptions; opening a sheet from the index lists its entries; and the whole thing works with the network disabled."
allowed_scope: client-app
difficulty: easy

ground_truth:
  source: "GitHub / Twitter/X"
  metric: github_stars
  value: 15172
