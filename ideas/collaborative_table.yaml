# Idea Bench spec. See ideas/README.md for the field reference.
# Reference app (ground truth): NocoDB — https://github.com/nocodb/nocodb
# Verified 64,432 GitHub stars on 2026-08-06.
# Show HN reached 562 points: https://news.ycombinator.com/item?id=27890847

idea_id: collaborative_table
title: "Gridwork"
pitch: "Turn a database into a shared spreadsheet your whole team can edit in the browser."
problem: "Spreadsheets are easy but fall apart with multiple editors and any real structure, while a real database means writing SQL that most of the team cannot."
target_user: "Small teams tracking structured work (inventory, applicants, bugs) who want a database without needing SQL."
core_features:
  - "Create a table and define its columns with types (text, number, date, single-select, checkbox)"
  - "Add, edit, and delete rows in a spreadsheet-style grid"
  - "Sort and filter rows by column value, and hide columns"
  - "Accounts and a shared workspace, so several people work against the same table"
  - "A row edited by one user is visible to another user viewing the same table"
success_criteria: "One signed-in user creates a table with a select column and adds several rows; a second, separate user opens the same table, sees those rows, edits one and adds another, and the first user sees both changes after reloading — with sorting and filtering returning the correct subset."
allowed_scope: full-stack-app
difficulty: hard

ground_truth:
  source: "Hacker News"
  metric: github_stars
  value: 64432
