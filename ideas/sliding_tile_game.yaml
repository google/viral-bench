# Idea Bench spec. See ideas/README.md for the field reference.
# Reference app (ground truth): 2048 — https://github.com/gabrielecirulli/2048
# Verified 13,350 GitHub stars on 2026-08-06.
#
# Observability note: a reviewer reads the rendered DOM and ARIA tree. A board
# painted to a <canvas>, or rendered as bare numbers, flattens to something like
# "Score: 0 Best: 0 2 2 4" with no way to tell WHERE the tiles are -- so merge
# behaviour becomes unverifiable and the reviewer is reduced to guessing. Hence
# the explicit requirement below that each cell expose its position and value.

idea_id: sliding_tile_game
title: "TileMerge"
pitch: "An addictive single-page puzzle where you slide numbered tiles and merge them to reach a target."
problem: "People want a quick, satisfying browser game they can pick up instantly with no install, account, or ads."
target_user: "Casual players looking for a simple, replayable time-filler in the browser."
core_features:
  - "A 4x4 grid where arrow keys (and swipe) slide all tiles in one direction"
  - "Matching tiles merge into their sum when they collide, and a new tile spawns each move"
  - "Live score plus a persisted best score"
  - "Win state on reaching the target tile and a game-over state when no moves remain"
  - "Restart button and smooth tile-movement animations"
  - "Render the board as real DOM elements, each cell labelled with its row, column, and current value (e.g. an aria-label like \"row 2, column 3, tile 4\"), so the board state is readable by assistive technology and not only visible"
success_criteria: "Pressing an arrow key slides every tile in that direction and merges equal adjacent tiles into their sum exactly once per move, with a new tile appearing afterwards; the board's cell positions and values are individually readable from the page, the score increases by the value of each merge, and the best score survives a reload."
allowed_scope: client-app
difficulty: easy

ground_truth:
  source: "Hacker News"
  metric: github_stars
  value: 13350
